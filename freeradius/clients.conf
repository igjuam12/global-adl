# ==============================================================================
# clients.conf - quién le puede hacer preguntas a este RADIUS
# Parte 2 (FreeRADIUS)
#
# Un "cliente" RADIUS no es un abonado: es el equipo que pregunta por los
# abonados, o sea el router. Si un pedido llega desde una IP que no está acá,
# FreeRADIUS lo descarta sin contestar.
#
# El secreto no está escrito en este archivo: $ENV{...} lo toma de una
# variable de entorno, que Docker carga desde .env.
# ==============================================================================

# El router del ISP. Tiene que ser la misma IP que el router pone como origen
# (src-address=10.10.50.1) y el mismo secreto de su /radius.
client isp-router {
	ipaddr = 10.10.50.1
	secret = $ENV{RADIUS_SHARED_SECRET}
	shortname = isp-router

	# Exigir que cada pedido venga firmado (Message-Authenticator). RouterOS 7
	# lo manda siempre; un pedido sin firma se descarta.
	require_message_authenticator = yes
}

# Pruebas desde adentro del propio contenedor, con radtest, sin usar el router.
client pruebas-locales {
	ipaddr = 127.0.0.1
	secret = $ENV{RADIUS_SHARED_SECRET}
	shortname = pruebas-locales
}
