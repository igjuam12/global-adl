# ==============================================================================
# pg_hba.conf - quién puede entrar a la base, con qué usuario y desde dónde
# Parte 1 (Base de Datos)
#
# PostgreSQL lee esta lista de arriba hacia abajo y usa la primera línea que
# coincide. Lo que no coincide con ninguna, se rechaza. Si se cambia este
# archivo, el despliegue le avisa a PostgreSQL para que lo relea, sin reiniciarla.
#
# Columnas: tipo de conexión, base, usuario, desde dónde, cómo se identifica
# ==============================================================================

# Desde adentro del propio contenedor, sin pasar por la red. Es por donde
# entramos nosotros a administrar (docker compose exec postgres psql ...).
# Por la red, el administrador no puede entrar desde ningún lado.
local   all      all                           trust

# FreeRADIUS: llega por la red interna de Docker (direcciones 172.16 a 172.31),
# con su usuario y su clave.
host    radius   radius       172.16.0.0/12    scram-sha-256

# Grafana: llega desde la VM de monitoreo, con el usuario que solo lee vistas.
host    radius   grafana_ro   10.10.50.20/32   scram-sha-256
