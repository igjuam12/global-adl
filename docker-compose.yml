name: isp-lab

services:
  # ==============================================================================
  # PARTE 1: Base de Datos (PostgreSQL 17) - [ACTIVO]
  # Responsable: Agustín
  # ==============================================================================
  postgres:
    image: postgres:17
    container_name: isp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: radius
      POSTGRES_USER: radius
      POSTGRES_PASSWORD: ${RADIUS_DB_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radius -d radius"]
      interval: 5s
      timeout: 3s
      retries: 10
    # DECISIÓN DE SEGURIDAD (Justificada en notas/agustin.md):
    # PostgreSQL NO publica puertos hacia Windows ni la red externa.
    # Solo es accesible por FreeRADIUS y Grafana a través de la red interna de Docker.

  # ==============================================================================
  # PARTE 2: FreeRADIUS 3.2.10 - [ACTIVO]
  # Responsable: Nico
  # ==============================================================================
  freeradius:
    image: freeradius/freeradius-server:3.2.10
    container_name: isp-freeradius
    restart: unless-stopped
    # Modo debug (-X = -sfxx -l stdout): detalle de cada pedido en
    # "docker compose logs -f freeradius". En producción se sacaría.
    command: -X
    # Espera a que la base esté sana: los routers (tabla nas) y los
    # abonados se leen de PostgreSQL. Ver notas/nico.md.
    depends_on:
      postgres:
        condition: service_healthy
    # Solo en la IP de la red de servicios: lo alcanza el router, no la red NAT
    ports:
      - "10.10.50.10:1812:1812/udp"   # autenticación
      - "10.10.50.10:1813:1813/udp"   # accounting
    # Montar el módulo en mods-enabled lo activa (el original de
    # mods-available no se toca). clients.conf no se monta: los routers
    # se leen de la tabla nas (read_clients = yes en freeradius/sql).
    volumes:
      - ./freeradius/sql:/etc/raddb/mods-enabled/sql:ro

  # ==============================================================================
  # PARTE 5: Telegraf (Recolección SNMP y Syslog) - (Se descomenta con Parte 5)
  # ==============================================================================
