name: isp-lab

services:
  # ==============================================================================
  # PARTE 1: Base de Datos (PostgreSQL 17) - [ACTIVO]
  # Responsable: Agustín
  # ==============================================================================
  postgres:
    image: postgres:17
    container_name: isp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: radius
      POSTGRES_USER: radius
      POSTGRES_PASSWORD: ${RADIUS_DB_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radius -d radius"]
      interval: 5s
      timeout: 3s
      retries: 10
    # DECISIÓN DE SEGURIDAD (Justificada en notas/agustin.md):
    # PostgreSQL NO publica puertos hacia Windows ni la red externa.
    # Solo es accesible por FreeRADIUS y Grafana a través de la red interna de Docker.

  # ==============================================================================
  # PARTE 2: FreeRADIUS 3.2 - (Se descomenta al integrar con Parte 2)
  # ==============================================================================
  # freeradius:
  #   image: freeradius/freeradius-server:latest-3.2
  #   container_name: isp-freeradius
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   ports:
  #     - "10.10.50.10:1812:1812/udp"
  #     - "10.10.50.10:1813:1813/udp"
  #   volumes:
  #     - ./freeradius/clients.conf:/etc/raddb/clients.conf:ro
  #     - ./freeradius/sql:/etc/raddb/mods-enabled/sql:ro

  # ==============================================================================
  # PARTE 5: Alloy (recolector único: SNMP del router + syslog) - [ACTIVO]
  # Responsable: Igna. Reemplaza al Telegraf que proponía la guía de referencia
  # (el porqué está en notas/igna.md).
  # ==============================================================================
  alloy:
    image: grafana/alloy:v1.21.0
    container_name: isp-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - prometheus
      - loki
    ports:
      - "10.10.50.10:1514:1514/udp"   # syslog que manda el router (red de servicios)
      - "${GESTION_IP:-127.0.0.1}:12345:12345"   # interfaz web de Alloy (diagnóstico)
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./alloy/snmp-auths.yml:/etc/alloy/snmp-auths.yml:ro
      - alloydata:/var/lib/alloy/data

  # ==============================================================================
  # PARTE 5: Prometheus (métricas del router; las empuja Alloy por remote_write)
  # ==============================================================================
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: isp-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    ports:
      - "${GESTION_IP:-127.0.0.1}:9090:9090"   # solo diagnóstico, no se publica a la red de servicios
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  # ==============================================================================
  # PARTE 5: Loki (logs de syslog del MikroTik). Sin puerto publicado: solo lo
  # usan Alloy (escribe) y Grafana (lee) por la red interna de Docker.
  # ==============================================================================
  loki:
    image: grafana/loki:3.7.0
    container_name: isp-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - lokidata:/loki

  # ==============================================================================
  # PARTE 1 y 5: Grafana (Tablero del NOC de ISP) - [ACTIVO]
  # ==============================================================================
  grafana:
    image: grafana/grafana:13.2.1
    container_name: isp-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
  alloydata:
  promdata:
  lokidata:
  grafanadata:
