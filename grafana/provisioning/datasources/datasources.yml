apiVersion: 1

datasources:
  - name: Prometheus
    uid: ds-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: ds-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  # Hoy va a fallar el "Save & test": PostgreSQL todavía no está en este compose.
  - name: RADIUS-PostgreSQL
    uid: ds-radius
    type: postgres
    url: postgres:5432
    user: grafana_ro
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: radius
      sslmode: disable
    editable: false
