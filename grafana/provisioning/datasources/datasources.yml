apiVersion: 1

datasources:
  - name: Prometheus
    uid: ds-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: ds-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  # La base está en la otra VM (isp-servicios). Entra con grafana_ro, que solo
  # puede leer las cuatro vistas del tablero, y solo desde esta VM
  # (postgres/init/04-roles-y-permisos.sh y postgres/pg_hba.conf).
  - name: RADIUS-PostgreSQL
    uid: ds-radius
    type: postgres
    url: 10.10.50.10:5432
    user: grafana_ro
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: radius
      sslmode: disable
    editable: false
